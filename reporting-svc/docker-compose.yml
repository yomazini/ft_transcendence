name: ft-transcendence

networks:
  ft_network:
    driver: bridge

services:
  reporting-svc:
    build: ./
    expose: ["3003"]
    env_file: .env.example
    ports:
      - "3003:3003"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Oussama

  # --- Data stores --------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env.example
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Oussama (schema/migrations across all services)
