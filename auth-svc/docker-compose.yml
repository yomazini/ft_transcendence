services:
  postgres:
    container_name: postgres
    image: pgvector/pgvector:pg16
    env_file: .env.example
    ports:
      - "5432:5432"
    volumes:
      - auth_postgres_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [auth-network]

  auth-svc:
    container_name: auth-svc
    build: .
    ports:
      - "3002:3002"
    env_file: .env.example
    environment:
      # Overrides .env.example's DATABASE_URL (which uses localhost,
      # for running Prisma CLI/start:dev on the host). Inside Compose,
      # auth-svc reaches postgres by its service name, not localhost.
      DATABASE_URL: postgresql://auth_dev:auth_dev@postgres:5432/auth_dev
    depends_on:
      postgres:
        condition: service_healthy
    networks: [auth-network]

networks:
  auth-network:
    name: authnet

volumes:
  auth_postgres_db:
    name: auth_db
