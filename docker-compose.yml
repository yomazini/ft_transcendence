# ft_transcendence — full stack, one command: docker compose up
# 13 services. Internal ports are never exposed to the host except through
# nginx (80) and the dashboards meant for direct viewing (grafana, prometheus).
name: ft-transcendence

networks:
  ft_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  minio_data:

services:
  # --- Entry point -----------------------------------------------------
  nginx:
    build: ./nginx
    ports: ["8080:8080"]
    environment:
      # The OWASP rules allow only GET HEAD POST OPTIONS by default; the API also
      # uses PATCH (change a role, edit the org) and DELETE (remove a member, a job, an account).
      ALLOWED_METHODS: "GET HEAD POST OPTIONS PATCH DELETE"
    depends_on: [gateway-svc, frontend]
    healthcheck:
      # The image's own check calls https on 8443; this project serves plain http on 8080.
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [ft_network]
    restart: unless-stopped

  frontend:
    build: ./frontend
    expose: ["3000"]
    depends_on: [gateway-svc]
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Hamza

  # --- Application services ---------------------------------------------
  gateway-svc:
    build: ./gateway-svc
    ports: ["3001:3001"]
    expose: ["3001"]
    env_file: .env
    depends_on: [redis, postgres]
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Youssef

  auth-svc:
    build: ./auth-svc
    expose: ["3002"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      vault: { condition: service_started }
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Mehdi

  scraper-svc:
    build: ./scraper-svc
    expose: ["8000"]
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Madani

  analysis-svc:
    build: ./analysis-svc
    ports: ["8001:8001"]
    expose: ["8001"]
    env_file: .env
    environment:
      # scraper-svc reads scrape-job and forwards the comments here.
      QUEUE_NAME: analyze-job
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Youssef

  reporting-svc:
    build: ./reporting-svc
    expose: ["3003"]
    env_file: .env
    environment:
      # The MinIO keys come from the root .env, so they match the minio service.
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Oussama

  # Object storage for reporting-svc backups (it fails to start without it).
  minio:
    image: soldevelo/minio:2026.7.17
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: ["minio_data:/bitnami/minio/data"]
    expose: ["9000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Oussama

  # --- Data stores --------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Oussama (schema/migrations across all services)

  redis:
    image: redis:7-alpine
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ft_network]
    restart: unless-stopped

  # --- Security & secrets -----------------------------------------------
  vault:
    build: ./vault
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDDIT_SESSIONS: ${REDDIT_SESSIONS}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test:
        - CMD-SHELL
        - VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN="$VAULT_DEV_ROOT_TOKEN_ID" vault kv get secret/database >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    expose: ["8200"]
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Madani. Dev-mode Vault — fine for this project's scope; a real
    # production Vault needs a proper unseal + storage backend.

  # --- Observability -------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Hamza

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes: ["grafana_data:/var/lib/grafana"]
    ports: ["3030:3000"]
    depends_on: [prometheus]
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Hamza

  # --- Mocked payment ------------------------------------------------------
  stripe-mock:
    image: stripe/stripe-mock:latest
    ports: ["12111:12111", "12112:12112"]
    networks: [ft_network]
    restart: unless-stopped

  # --- pgAdmin (database UI) -------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ft-transcendence-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ft_network]
    restart: unless-stopped
