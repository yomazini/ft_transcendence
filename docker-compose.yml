  # --- pgAdmin (database UI, for development) ---------------------------
  # Credentials come from .env; published on this machine only.
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports: ["127.0.0.1:5050:80"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [ft_network]
    restart: unless-stopped
  # new service for rstoring backups
  restore-svc:
    profiles: ["recovery"]
    container_name: restore-svc
    build:
      context: ./restore-svc
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./vault/creds/minio:/run/vault

    networks:
      - ft_network

    restart: "no"
# new service to init minio
  minio-init:
    build:
      context: ./restore-svc
      dockerfile: Dockerfile.init
    container_name: minio-init
    volumes:
      - ./restore-svc/scripts/init-minio.sh:/scripts/init-minio.sh:ro
      - ./vault/creds/minio:/run/vault:ro
    depends_on:
      vault:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ft_network
    restart: "no"