name: ft-transcendence

networks:
  ft_network:
    name: ft_network
    driver: bridge

secrets:
  env:
    file: ./.env

volumes:
  postgres_data:
    name: postgres_db
  redis_data:
    name: redis_db
  redisinsight_data:
    name: redisinsight_db
  grafana_data:
    name: grafana_db
  minio_data:
    name: minio_db
  minio_certs:
    name: minio_certs_db
  prometheus_data:
    name: prometheus_db
  vault_data:
    name: vault_db
services:
  nginx:
    container_name: nginx
    image: nginx-waf
    build: ./nginx
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"]
    environment:
      ALLOWED_METHODS: "GET POST PATCH DELETE PUT"
    depends_on: [gateway-svc, frontend, auth-svc, reporting-svc, grafana]
    volumes:
      - "./nginx/cert:/etc/nginx/ssl:ro"
    healthcheck:
      test: ["CMD-SHELL", "curl -kfs https://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [ft_network]
    restart: unless-stopped

  frontend:
    container_name: frontend
    image: frontend
    build: ./frontend
    expose: ["3000"]
    depends_on: [gateway-svc]
    networks: [ft_network]
    restart: unless-stopped

  gateway-svc:
    container_name: gateway-svc
    image: gateway-svc
    build: ./gateway-svc
    expose: ["3001"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3001"
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:8080}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-ft_transcendence}
      POSTGRES_DB: ${POSTGRES_DB:-ft_transcendence}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_SVC_URL: http://auth-svc:3002
      ANALYSIS_SVC_URL: http://analysis-svc:8001
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
    depends_on:
      postgres: { condition: service_healthy }
      vault: { condition: service_healthy }
    volumes:
      - "./vault/creds/gateway-svc:/run/vault:ro"
    networks: [ft_network]
    restart: unless-stopped

  auth-svc:
    container_name: auth-svc
    image: auth-svc
    build: ./auth-svc
    expose: ["3002"]
    ports: ["127.0.0.1:3002:3002"]
    environment:
      NODE_ENV: ${NODE_ENV:-prod}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_mock}
      STRIPE_MOCK_HOST: ${STRIPE_MOCK_HOST:-stripe-mock}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:8080}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_FROM: ${MAIL_FROM}
      FORTYTWO_CALLBACK_URL: ${FORTYTWO_CALLBACK_URL}
    depends_on:
      postgres: { condition: service_healthy }
      vault: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - "./vault/creds/auth-svc:/run/vault:ro"
    networks: [ft_network]
    restart: unless-stopped

  scraper-svc:
    container_name: scraper-svc
    image: scraper-svc
    build: ./scraper-svc
    expose: ["8000"]
    volumes:
      - ./vault/creds/scraper-svc:/creds
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      vault: { condition: service_healthy }
    networks: [ft_network]
    restart: unless-stopped

  analysis-svc:
    container_name: analysis-svc
    image: analysis-svc
    build: ./analysis-svc
    expose: ["8001"]
    environment:
      QUEUE_NAME: analyze-job
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-ft_transcendence}
      POSTGRES_DB: ${POSTGRES_DB:-ft_transcendence}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EVENTS_CHANNEL: job-events
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-google/gemma-4-26b-a4b-it}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      vault: { condition: service_healthy }
    volumes:
      - "./vault/creds/analysis-svc:/run/vault:ro"
    networks: [ft_network]
    restart: unless-stopped

  reporting-svc:
    container_name: reporting-svc
    image: reporting-svc
    build: ./reporting-svc
    expose: ["3003"]
    volumes:
      - "./vault/creds/database:/run/vault:ro"
      - "./vault/creds/minio:/run/vault:ro"
    environment:
      MINIO_BROWSER: ${MINIO_BROWSER:-on}
      MINIO: ${MINIO:-minio}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-min-io-st}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      BACKUP_PATH: ${BACKUP_PATH:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-/tmp/backups}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [ft_network]
    restart: unless-stopped

  minio:
    container_name: minio
    image: minio
    build:
      context: ./restore-svc
      dockerfile: Dockerfile.minio
    environment:
      MINIO_BROWSER: ${MINIO_BROWSER:-on}
      MINIO: ${MINIO:-minio}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-min-io-st}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
    volumes:
      - minio_data:/bitnami/minio/data
      - minio_certs:/certs
      - ./vault/creds/minio:/run/vault
    depends_on:
      vault:
        condition: service_healthy
    expose:
      - "9000"
      - "9001"
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - ft_network

    restart: unless-stopped

  postgres:
    build:
      context: ./reporting-svc
      dockerfile: Dockerfile.postgres
    container_name: postgres
    image: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./vault/creds/database:/run/vault:ro
      - ./reporting-svc/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    expose: ["5432"]
    depends_on:
      vault:
        condition: service_healthy
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U "$$(cat /tmp/postgres-health-user)" -d "$$(cat /tmp/postgres-health-db)"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - ft_network

    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:7-alpine
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ft_network]
    restart: unless-stopped

  redisinsight:
    container_name: redisinsight
    image: redis/redisinsight:latest
    ports: ["127.0.0.1:5540:5540"]
    volumes: ["redisinsight_data:/data"]
    depends_on:
      redis: { condition: service_healthy }
    networks: [ft_network]
    restart: unless-stopped

  vault:
    container_name: vault
    image: vault-prod
    build: ./vault
    cap_add: [IPC_LOCK]
    secrets:
      - env
    volumes:
      - "vault_data:/vault"
      - "./vault/secret:/secret"
      - "./vault/creds:/credentials"
      - "./vault/audit/:/audit"
    healthcheck:
      test: ["CMD", "/health_check.sh"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    expose: ["8200"]
    networks: [ft_network]
    restart: unless-stopped

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.15.0
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"
      - "prometheus_data:/prometheus"
    networks: [ft_network]
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:13.2.4
    environment:
      GF_SERVER_PROTOCOL: http
      GF_SERVER_HTTP_PORT: 3030
      GF_SERVER_DOMAIN: grafana.localhost
      GF_SERVER_ROOT_URL: https://grafana.localhost:8080/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - "grafana_data:/var/lib/grafana"
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./grafana/dashboards:/var/lib/grafana/dashboards:ro"
    depends_on: [prometheus]
    networks: [ft_network]
    restart: unless-stopped

  postgres-exporter:
    container_name: postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on: [postgres]
    networks: [ft_network]
    restart: unless-stopped

  redis-exporter:
    container_name: redis-exporter
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
    networks: [ft_network]
    restart: unless-stopped

  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:v1.8.2
    networks: [ft_network]
    restart: unless-stopped

  stripe-mock:
    container_name: stripe-mock
    image: stripe/stripe-mock:v0.206.0
    ports: ["12111:12111", "12112:12112"]
    networks: [ft_network]
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports: ["127.0.0.1:5050:80"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [ft_network]
    restart: unless-stopped
  restore-svc:
    profiles: ["recovery"]
    container_name: restore-svc
    build:
      context: ./restore-svc
      dockerfile: Dockerfile
    environment:
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      BACKUP_PATH: ${BACKUP_PATH:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-/tmp/backups}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      LOGIN_FILE: ${LOGIN_FILE:-/run/vault/login.json}
      MINIO_BROWSER: ${MINIO_BROWSER:-on}
      MINIO: ${MINIO:-minio}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-min-io-st}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    volumes:
      - ./vault/creds/minio:/run/vault

    networks:
      - ft_network

    restart: "no"

  gatus:
    image: twinproduction/gatus:stable
    container_name: gatus
    restart: unless-stopped
    environment:
      GATUS_CONFIG_PATH: /config/config.yaml
      SSL_CERT_FILE: /certs/server.pem
    ports:
      - "4443:8080"
    volumes:
      - ./gatus/config.yaml:/config/config.yaml:ro
      - ./nginx/cert:/certs:ro
    networks:
      - ft_network
