name: ft-transcendence

networks:
  ft_network:
    name: ft_network
    driver: bridge

volumes:
  postgres_data:
    name: postgres_db
  redis_data:
    name: redis_db
  grafana_data:
    name: grafana_db
  minio_data:
    name: minio_db
  minio_certs:
    name: minio_certs_db
  prometheus_data:
    name: prometheus_db
  vault_data:
    name: vault_db
  vault_logs:
    name: vault_logs_db

services:

  nginx:
    container_name: nginx
    image: nginx-waf
    build: ./nginx
    ports: ["8080:8080"]
    environment:
      ALLOWED_METHODS: "GET HEAD POST OPTIONS PATCH DELETE"
    depends_on: [gateway-svc, frontend]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [ft_network]
    restart: unless-stopped

  frontend:
    container_name: frontend
    image: frontend
    build: ./frontend
    expose: ["3000"]
    depends_on: [gateway-svc]
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Hamza

  gateway-svc:
    container_name: gateway-svc
    image: gateway-svc
    build: ./gateway-svc
    ports: ["3001:3001"]
    expose: ["3001"]
    env_file: .env
    depends_on: [redis, postgres]
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Youssef

  auth-svc:
    container_name: auth-svc
    image: auth-svc
    build: ./auth-svc
    expose: ["3002"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      vault: { condition: service_started }
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Mehdi

  scraper-svc:
    container_name: scraper-svc
    image: scraper-svc
    build: ./scraper-svc
    expose: ["8000"]
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Madani

  analysis-svc:
    container_name: analysis-svc
    image: analysis-svc
    build: ./analysis-svc
    ports: ["8001:8001"]
    expose: ["8001"]
    env_file: .env
    environment:
      QUEUE_NAME: analyze-job
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Youssef

  reporting-svc:
    container_name: reporting-svc
    image: reporting-svc
    build: ./reporting-svc
    expose: ["3003"]
    env_file: .env
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Oussama

  minio:
    container_name: minio
    image: soldevelo/minio:2026.7.17
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: ["minio_data:/bitnami/minio/data", "minio_certs:/certs"]
    expose: ["9000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Oussama

  postgres:
    container_name: postgres
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Oussama

  redis:
    container_name: redis
    image: redis:7-alpine
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ft_network]
    restart: unless-stopped

  vault:
    container_name: vault
    image: vault-dev
    build: ./vault
    cap_add: [IPC_LOCK]
    volumes: ["vault_data:/vault/file", "vault_logs:/vault/logs"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDDIT_SESSIONS: ${REDDIT_SESSIONS}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test:
        - CMD-SHELL
        - VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN="$VAULT_DEV_ROOT_TOKEN_ID" vault kv get secret/database >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    expose: ["8200"]
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Madani.

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"
      - "prometheus_data:/prometheus"
    ports: ["9090:9090"]
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Mehdi.

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - "grafana_data:/var/lib/grafana"
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./grafana/dashboards:/var/lib/grafana/dashboards:ro"
    ports: ["3030:3000"]
    depends_on: [prometheus]
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Mehdi.
  postgres-exporter:
    container_name: postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on: [postgres]
    networks: [ft_network]

  redis-exporter:
    container_name: redis-exporter
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
    networks: [ft_network]

  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:v1.8.2
    networks: [ft_network]

  stripe-mock:
    container_name: stripe-mock
    image: stripe/stripe-mock:latest
    ports: ["12111:12111", "12112:12112"]
    networks: [ft_network]
    restart: unless-stopped
