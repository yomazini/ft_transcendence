# ft_transcendence — full stack, one command: docker compose up (or: make up)
# Internal ports are never exposed to the host except through nginx (HTTP_PORT,
# default 8080) and the dashboards meant for direct viewing (grafana, prometheus).
name: ft-transcendence

# Fixed names (name:), so Docker does not add the "ft-transcendence_" prefix.
networks:
  ft_network:
    name: ft_network
    driver: bridge

volumes:
  postgres_data:
    name: postgres_db
  redis_data:
    name: redis_db
  redisinsight_data:
    name: redisinsight_db
  grafana_data:
    name: grafana_db
  minio_data:
    name: minio_db
  minio_certs:
    name: minio_certs_db
  prometheus_data:
    name: prometheus_db
  vault_data:
    name: vault_db
services:
  # --- Entry point -----------------------------------------------------
  nginx:
    container_name: nginx
    image: nginx-waf
    build: ./nginx
    ports: ["${HTTP_PORT:-8080}:8080", "127.0.0.1:${PORT_GF:-3030}:${PORT_GF:-3030}"]
    environment:
      PORT_GF: ${PORT_GF:-3030}
      ALLOWED_METHODS: "GET POST PATCH DELETE PUT"
    depends_on: [gateway-svc, frontend, auth-svc, reporting-svc, grafana]
    volumes:
      - "./nginx/cert:/etc/nginx/ssl:ro"
    healthcheck:
      # The image's own check calls https on 8443; this project serves plain http on 8080.
      test: ["CMD-SHELL", "curl -kfs https://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [ft_network]
    restart: unless-stopped

  frontend:
    container_name: frontend
    image: frontend
    build: ./frontend
    expose: ["3000"]
    depends_on: [gateway-svc]
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Hamza

  # --- Application services ---------------------------------------------
  gateway-svc:
    container_name: gateway-svc
    image: gateway-svc
    build: ./gateway-svc
    expose: ["3001"]
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
      vault: { condition: service_healthy }
    volumes:
      - "./vault/creds/gateway-svc:/run/vault:ro"
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Youssef

  auth-svc:
    container_name: auth-svc
    image: auth-svc
    build: ./auth-svc
    expose: ["3002"]
    ports: ["127.0.0.1:3002:3002"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      vault: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - "./vault/creds/auth-svc:/run/vault:ro" # [HOST_PATH]:[CONTAIENRT_PATH]:ro(readonly)
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Mehdi

  scraper-svc:
    container_name: scraper-svc
    image: scraper-svc
    build: ./scraper-svc
    expose: ["8000"]
    env_file: .env
    volumes:
      - ./vault/creds/scraper-svc:/creds
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      vault: { condition: service_healthy }
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Madani

  analysis-svc:
    container_name: analysis-svc
    image: analysis-svc
    build: ./analysis-svc
    expose: ["8001"]
    env_file: .env
    environment:
      # scraper-svc reads scrape-job and forwards the comments here.
      QUEUE_NAME: analyze-job
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      vault: { condition: service_healthy }
    volumes:
      - "./vault/creds/analysis-svc:/run/vault:ro"
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Youssef

  reporting-svc:
    container_name: reporting-svc
    image: reporting-svc
    build: ./reporting-svc
    expose: ["3003"]
    env_file: .env
    volumes:
      # i shod separate them later thy overwrite them selfs 
      - "./vault/creds/database:/run/vault:ro"
      - "./vault/creds/minio:/run/vault:ro"
    environment:
      # The MinIO keys come from the root .env, so they match the minio service.
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Oussama

  # Object storage for reporting-svc backups (it fails to start without it).
  minio:
    container_name: minio
    image: minio
    build:
      context: ./restore-svc
      dockerfile: Dockerfile.minio

    volumes:
      - minio_data:/bitnami/minio/data
      - minio_certs:/certs
      - ./vault/creds/minio:/run/vault

    depends_on:
      vault:
        condition: service_healthy
    expose:
      - "9000"
      - "9001"

    env_file: .env
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - ft_network

    restart: unless-stopped
    # Owner: Oussama

  # --- Data stores --------------------------------------------------------
  postgres:
    build:
      context: ./reporting-svc
      dockerfile: Dockerfile.postgres
    container_name: postgres
    image: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./vault/creds/database:/run/vault:ro
      - ./reporting-svc/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    expose: ["5432"]
    depends_on:
      vault:
        condition: service_healthy
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U "$$(cat /tmp/postgres-health-user)" -d "$$(cat /tmp/postgres-health-db)"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - ft_network

    restart: unless-stopped
    # Owner: Oussama (schema/migrations across all services)

  redis:
    container_name: redis
    image: redis:7-alpine
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ft_network]
    restart: unless-stopped

  redisinsight:
    container_name: redisinsight
    image: redis/redisinsight:latest
    ports: ["127.0.0.1:5540:5540"]
    volumes: ["redisinsight_data:/data"]
    depends_on:
      redis: { condition: service_healthy }
    networks: [ft_network]
    restart: unless-stopped

  # --- Security & secrets -----------------------------------------------
  vault:
    container_name: vault
    image: vault-prod
    build: ./vault
    ports: ["127.0.0.1:8200:8200"]
    cap_add: [IPC_LOCK]
    env_file: .env # every secret configuration.sh puts into Vault
    environment:
      CREDS_FILE: /secret/credentials.json # unseal key + root token, kept outside the data volume
    volumes:
      - "vault_data:/vault" # Vault data + config (server.hcl stores in /vault/data)
      - "./vault/secret:/secret" # credentials.json — git-ignored
      - "./vault/creds:/credentials" # one <service>.json login per service — git-ignored
      - "./vault/audit/:/audit"
    healthcheck:
      test: ["CMD", "/health_check.sh"] # unsealed AND setup finished
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    expose: ["8200"]
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Madani. Production mode: file storage, auto-unseal, one AppRole + policy per service.

  # --- Observability (Prometheus + Grafana module) --------------------------
  # Prometheus scrapes /metrics from the services and the exporters every 15 s
  # (prometheus/prometheus.yml) and checks the alert rules (prometheus/alerts.yml).
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.15.0
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"
      - "prometheus_data:/prometheus"
    # Prometheus has no login: published on this machine only. Grafana reaches it
    # inside ft_network at http://prometheus:9090.
    ports: ["127.0.0.1:9090:9090"]
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Mehdi

  # Dashboards and the data source are loaded from files at start (grafana/provisioning).
  grafana:
    container_name: grafana
    image: grafana/grafana:13.2.4
    environment:
      GF_SERVER_PROTOCOL: http
      GF_SERVER_HTTP_PORT: 3030
      GF_SERVER_DOMAIN: grafana.localhost
      GF_SERVER_ROOT_URL: https://grafana.localhost:8080/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false" # no access without login
      GF_USERS_ALLOW_SIGN_UP: "false" # nobody can create an account
    volumes:
      - "grafana_data:/var/lib/grafana"
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./grafana/dashboards:/var/lib/grafana/dashboards:ro"
    # ports: ["3040:3000"]
    depends_on: [prometheus]
    networks: [ft_network]
    restart: unless-stopped
    # Owner: Mehdi

  # Exporters: translate Postgres / Redis / host numbers into the Prometheus format.
  # No ports: only Prometheus, inside ft_network, reads them.
  postgres-exporter:
    container_name: postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on: [postgres]
    networks: [ft_network]
    restart: unless-stopped

  redis-exporter:
    container_name: redis-exporter
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
    networks: [ft_network]
    restart: unless-stopped

  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:v1.8.2
    networks: [ft_network]
    restart: unless-stopped

  # --- Mocked payment ------------------------------------------------------
  stripe-mock:
    container_name: stripe-mock
    image: stripe/stripe-mock:latest
    ports: ["12111:12111", "12112:12112"]
    networks: [ft_network]
    restart: unless-stopped

  # --- pgAdmin (database UI, for development) ---------------------------
  # Credentials come from .env; published on this machine only.
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports: ["127.0.0.1:5050:80"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [ft_network]
    restart: unless-stopped
  # new service for rstoring backups
  restore-svc:
    profiles: ["recovery"]
    container_name: restore-svc
    build:
      context: ./restore-svc
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./vault/creds/minio:/run/vault

    networks:
      - ft_network

    restart: "no"

  gatus:
    image: twinproduction/gatus:stable
    container_name: gatus
    restart: unless-stopped
    environment:
      GATUS_CONFIG_PATH: /config/config.yaml
      SSL_CERT_FILE: /certs/server.pem
    ports:
      - "4443:8080"
    volumes:
      - ./gatus/config.yaml:/config/config.yaml:ro
      - ./nginx/cert:/certs:ro
    networks:
      - ft_network
