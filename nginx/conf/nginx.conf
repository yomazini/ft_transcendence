server_tokens off;

client_max_body_size 16k;

client_header_buffer_size 1k;
large_client_header_buffers 2 4k;

client_header_timeout 10s;
send_timeout 10s;

ssl_protocols TLSv1.2 TLSv1.3;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
add_header Strict-Transport-Security "max-age=31536000" always;
proxy_hide_header X-Powered-By;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

map $http_x_api_key $api_key_ip  {
	"" "";
	default $binary_remote_addr;
}

limit_req_zone $api_key_ip
	zone=ip_limit:10m
	rate=20r/m;

server {
	listen ${PORT} ssl;
	server_name localhost nginx;

	ssl_certificate /etc/nginx/ssl/server.pem;
	ssl_certificate_key /etc/nginx/ssl/server.key;

	set $upstream_gateway http://gateway-svc:3001;
	set $upstream_frontend http://frontend:3000;
	set $upstream_reporting http://reporting-svc:3003;
	set $upstream_auth http://auth-svc:3002;

	limit_req_status 429;

	location = /healthz {
		access_log off;
		return 200 "OK";
	}

	location / {
		proxy_pass $upstream_frontend;
	}

	location /api/reporting/ {
		limit_except GET {
			deny all;
		}
		auth_request /_auth;
		auth_request_set $org_id $upstream_http_x_org_id;
		proxy_set_header org-id $org_id;
		rewrite ^/api/reporting/(.*)$ /reporting/$1 break;
		proxy_pass $upstream_reporting;
	}

	location /api/ {
		limit_req zone=ip_limit burst=5 nodelay;
		proxy_pass $upstream_gateway;
	}

	location /socket.io/ {
		proxy_pass $upstream_gateway;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;

		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";

		proxy_read_timeout 1h;
	}

	location = /_auth {
		internal;
		proxy_pass $upstream_auth/auth/verify;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
	}

}

server {
	listen ${PORT} ssl;
	server_name status.localhost;

	ssl_certificate /etc/nginx/ssl/server.pem;
	ssl_certificate_key /etc/nginx/ssl/server.key;
	
	set $upstream_gatus https://gatus:4443;

	location / {
		proxy_pass $upstream_gatus;
	}
}

server {
	listen ${PORT} ssl;
	server_name grafana.localhost;

	ssl_certificate /etc/nginx/ssl/server.pem;
	ssl_certificate_key /etc/nginx/ssl/server.key;

	set $upstream_grafana http://grafana:3030;

	location / {
		proxy_pass $upstream_grafana;

		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;

		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";

		proxy_read_timeout 90s;
		proxy_send_timeout 90s;
	}
}
