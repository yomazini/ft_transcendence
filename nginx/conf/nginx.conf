server_tokens off;

client_max_body_size 16k;

client_header_buffer_size 1k;
large_client_header_buffers 2 4k;

client_header_timeout 10s;
send_timeout 10s;

server {

	listen ${PORT} ssl;
	server_name localhost;

	ssl_certificate /etc/nginx/ssl/server.pem;
	ssl_certificate_key /etc/nginx/ssl/server.key;
	ssl_protocols TLSv1.2 TLSv1.3;

	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
	add_header Strict-Transport-Security "max-age=31536000" always;

	location = /healthz {
		access_log off;
		return 200 "OK";
	}

	location / {
		proxy_pass http://frontend:3000;
	}

	location /api/reporting/ {
		limit_except GET {
			deny all;
		}
		auth_request /_auth;
		auth_request_set $org_id $upstream_http_x_org_id;
		proxy_set_header org-id $org_id;
		rewrite ^/api/reporting/(.*)$ /reporting/$1 break;
		proxy_pass http://reporting-svc:3003;
	}

	location /api/ {
		proxy_pass http://gateway-svc:3001;
	}

	location /socket.io/ {
		proxy_pass http://gateway-svc:3001;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

	location = /_auth {
		internal;
		proxy_pass http://auth-svc:3002/auth/verify;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
	}

}