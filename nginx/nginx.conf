# Reverse proxy: all inbound traffic -> gateway-svc.
# WAF rules are provided by the owasp/modsecurity-crs base image.
server {
    # Non-root user: cannot bind 80. PORT is 8080 in the base image; compose maps 80 -> 8080.
    listen ${PORT};

    # Security headers on every response (also on errors: `always`), and no version leaks.
    # No add_header inside the locations below, or these would stop being inherited.
    server_tokens off;
    proxy_hide_header X-Powered-By;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # The base image's health check calls /healthz.
    location = /healthz {
        access_log off;
        return 200 "OK";
    }

    location / {
        proxy_pass http://frontend:3000;
    }

    # Temporary: the gateway does not forward to auth-svc yet. Remove these two
    # blocks once gateway-svc proxies /auth and /orgs to auth-svc.
    location /api/auth/ {
        proxy_pass http://auth-svc:3002/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/orgs/ {
        proxy_pass http://auth-svc:3002/orgs/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # reporting-svc has no auth of its own: it trusts an `org-id` header. nginx first
    # asks auth-svc to check the token (auth_request), then sets `org-id` from the
    # verified token, overwriting anything the client sent.
    location /api/reporting/ {
        auth_request /_auth;
        auth_request_set $org_id $upstream_http_x_org_id;
        proxy_set_header org-id $org_id;
        proxy_set_header Host $host;
        proxy_pass http://reporting-svc:3003/reporting/;
    }

    location = /api/reporting {
        auth_request /_auth;
        auth_request_set $org_id $upstream_http_x_org_id;
        proxy_set_header org-id $org_id;
        proxy_set_header Host $host;
        proxy_pass http://reporting-svc:3003/reporting;
    }

    # Internal only: the token check used by auth_request above.
    location = /_auth {
        internal;
        proxy_pass http://auth-svc:3002/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # Live job status (Socket.IO, served by gateway-svc). Same origin as the page,
    # so it keeps working when the site moves to HTTPS (wss://).
    location /socket.io/ {
        proxy_pass http://gateway-svc:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # No trailing slash: the /api prefix is kept, because gateway-svc serves
    # its routes under @Controller('api') (e.g. /api/health, /api/jobs).
    location /api/ {
        proxy_pass http://gateway-svc:3001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
