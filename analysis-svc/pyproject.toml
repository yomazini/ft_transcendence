[project]
name = "analysis-svc"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "vaderSentiment",
  "textblob",
  "sentence-transformers",
  "google-generativeai",
  "pgvector",
  "asyncpg",
  "redis",
  "pydantic",
  "pydantic-settings",
  "httpx",
  "pytest",
  "pytest-asyncio",
  "numpy",
  "bullmq",
  "prometheus-client>=0.26.0",
  "hvac>=2.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"
