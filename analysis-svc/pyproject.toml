[project]
name = "analysis-svc"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "vaderSentiment",
    "textblob",
    "sentence-transformers",
    "google-generativeai",
    "pgvector",
    "asyncpg",
    "redis",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "pytest",
    "pytest-asyncio",
    "numpy",
    "bullmq",
]

[tool.pytest.ini_options]
pythonpath = ["."]
