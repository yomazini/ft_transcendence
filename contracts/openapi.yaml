openapi: 3.0.3
info:
  title: ft_transcendence API Contract
  version: 0.1.0
  description: >
    Shared contract between all 5 services and the frontend. This file is the
    source of truth — if code and this file disagree, the file wins until
    someone changes it here first, in a reviewed PR, not silently in their
    own service.

servers:
  - url: http://gateway-svc:3001
    description: Internal docker-compose network — everything goes through the gateway

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Organization:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time

    Role:
      type: string
      enum: [admin, analyst, viewer]

    User:
      type: object
      required: [id, org_id, email, role]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time

    ScrapeMode:
      type: string
      enum: [keyword, subreddit, post, user]

    CustomerPersona:
      type: object
      description: Optional, captured at job submission — see User Journey.
      properties:
        description:
          type: string
          example: "budget-conscious college students"
        price_sensitivity:
          type: string
          enum: [budget, mid-market, premium]
        top_priority:
          type: string
          example: "speed"

    Job:
      type: object
      required: [id, org_id, mode, target, status]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        mode:
          $ref: "#/components/schemas/ScrapeMode"
        target:
          type: string
          example: "r/freelance"
        customer_persona:
          $ref: "#/components/schemas/CustomerPersona"
        status:
          type: string
          enum: [queued, running, done, failed]
        created_at:
          type: string
          format: date-time

    Comment:
      type: object
      required: [id, job_id, text, upvotes]
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        text:
          type: string
        author:
          type: string
        upvotes:
          type: integer
        sentiment_score:
          type: number
          format: float
          nullable: true
        created_at:
          type: string
          format: date-time

    Report:
      type: object
      required: [id, job_id, swot, blue_ocean]
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        swot:
          type: object
        blue_ocean:
          type: object
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

paths:
  /api/jobs:
    post:
      summary: Submit a new scrape/analysis job
      operationId: createJob
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, target]
              properties:
                mode:
                  $ref: "#/components/schemas/ScrapeMode"
                target:
                  type: string
                customer_persona:
                  $ref: "#/components/schemas/CustomerPersona"
      responses:
        "201":
          description: Job created and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid JWT

  /api/jobs/{id}:
    get:
      summary: Get a job's current status
      operationId: getJob
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found, OR exists but belongs to another org — same response either way (BOLA-safe — never reveal via status code whether an ID exists for someone who shouldn't see it)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/reports/{id}:
    get:
      summary: Get a job's synthesized report
      operationId: getReport
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Report found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Not found, OR belongs to another org — same response either way (BOLA-safe)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
