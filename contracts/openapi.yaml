openapi: 3.0.3
info:
  title: ft_transcendence — Groundswell Social Intelligence API Contract
  version: 1.0.0
  description: >
    Unified OpenAPI specification for the Groundswell Multi-Tenant Social Intelligence Platform.
    Serves as the single source of truth across gateway-svc, auth-svc, scraper-svc, analysis-svc, and reporting-svc.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/api
    description: Nginx Reverse Proxy Public Gateway Entry Point

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token issued by auth-svc, valid 1 hour, signed HS256 with JWT_SECRET.
        Claims: sub (user id, uuid), org_id (uuid), role (Admin | Analyst | Viewer), iat, exp.
        There is no email claim. Tokens that carry a "purpose" claim (signup, invite,
        reset, 2fa) are single-use-case tokens and are refused as access tokens (401).
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Organization API key created by an Admin in Settings. Accepted by gateway-svc
        on the job, report and RAG routes only. Missing, unknown or revoked key gives 401.
        Rate limited per key. Not accepted by /auth/* or /orgs/*.

  schemas:
    Organization:
      type: object
      required: [id, name, description]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, minLength: 100, maxLength: 200 }
        created_at: { type: string, format: date-time }

    Role:
      type: string
      enum: [Admin, Analyst, Viewer]

    User:
      type: object
      required: [id, org_id, email, role]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        email: { type: string, format: email }
        is_2fa_enabled: { type: boolean }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }

    AuthResponse:
      type: object
      required: [access_token, token_type, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: "Bearer" }
        user: { $ref: "#/components/schemas/User" }

    TwoFactorChallenge:
      type: object
      description: >
        Returned by POST /auth/login instead of AuthResponse when the user has 2FA on.
        The password was correct, but no access token is issued yet. Send
        two_factor_token with the 6-digit code to POST /auth/2fa/verify.
      required: [two_factor_required, two_factor_token]
      properties:
        two_factor_required: { type: boolean, enum: [true] }
        two_factor_token:
          type: string
          description: JWT { sub, purpose "2fa" }, valid 5 minutes. Refused as an access token.

    TwoFactorCode:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^\\d{6}$", example: "123456", description: The 6-digit code from the authenticator app }

    TwoFactorSetup:
      type: object
      required: [qr_code, otpauth_url]
      properties:
        qr_code: { type: string, description: "PNG QR code as a data URL (data:image/png;base64,...)" }
        otpauth_url:
          type: string
          example: "otpauth://totp/InsightFlow:user%40example.com?secret=JBSWY3DPEHPK3PXP&issuer=InsightFlow"
          description: The same secret as text, for apps that can't scan the QR code

    TwoFactorState:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    Member:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid, description: "User id" }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }

    ApiKey:
      type: object
      description: Metadata of the organization's API key. Never contains the key or its hash.
      required: [id, prefix, label, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        prefix: { type: string, description: "First 7 characters of the key", example: "if_9Kd2" }
        label: { type: string, nullable: true, maxLength: 40, example: "Nightly export" }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }

    ApiKeyCreated:
      type: object
      description: Returned once, by POST /orgs/{id}/api-key only.
      required: [id, key, prefix, label, created_at]
      properties:
        id: { type: string, format: uuid }
        key:
          type: string
          description: >
            Full key, "if_" + 43 base64url characters. Shown once, never stored or
            returned again; the server keeps only its SHA-256 hash (hex, lowercase).
          example: "if_9Kd2rEufuP4XVZZAcLq3uQgkD8QwVrFdVVYvWJSjPGy"
        prefix: { type: string, example: "if_9Kd2" }
        label: { type: string, nullable: true, example: "Nightly export" }
        created_at: { type: string, format: date-time }

    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }

    DataExport:
      type: object
      required: [exported_at, user, membership, organization]
      properties:
        exported_at: { type: string, format: date-time }
        user:
          type: object
          required: [id, email, created_at]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            created_at: { type: string, format: date-time }
        membership:
          type: object
          required: [role]
          properties:
            role: { $ref: "#/components/schemas/Role" }
        organization: { $ref: "#/components/schemas/Organization" }

    ScrapeMode:
      type: string
      enum: [keyword, subreddit, post, user]

    CustomerPersona:
      type: object
      description: Target customer persona details provided during job submission.
      properties:
        description: { type: string, example: "budget-conscious college students" }
        price_sensitivity: { type: string, enum: [budget, mid-market, premium] }
        top_priority: { type: string, example: "speed" }

    Job:
      type: object
      required: [id, org_id, mode, target, name, status]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/ScrapeMode" }
        target: { type: string, example: "r/freelance" }
        name: { type: string, example: "Freelance pricing research" }
        customer_persona: { $ref: "#/components/schemas/CustomerPersona" }
        status: { type: string, enum: [queued, running, done, failed] }
        created_at: { type: string, format: date-time }

    Comment:
      type: object
      required: [id, job_id, text, upvotes]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        text: { type: string }
        author: { type: string }
        upvotes: { type: integer }
        sentiment_score: { type: number, format: float, nullable: true }
        created_at: { type: string, format: date-time }

    Report:
      type: object
      required: [id, job_id, swot, blue_ocean]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        swot: { type: object }
        blue_ocean: { type: object }
        created_at: { type: string, format: date-time }

    PlanTier:
      type: string
      enum: [free, premium, extra]
      description: free = 1 member / 5 jobs, premium = 5 members / 10 jobs, extra = 20 members / 20 jobs.

    Billing:
      type: object
      required: [organization_id, plan, status, member_count, max_users, max_jobs, price_cents, subscription_end, cancel_at_period_end]
      properties:
        organization_id: { type: string, format: uuid }
        plan: { $ref: "#/components/schemas/PlanTier" }
        status: { type: string, enum: [free, active, canceled, expired] }
        member_count: { type: integer }
        max_users: { type: integer }
        max_jobs: { type: integer }
        price_cents: { type: integer, example: 2900 }
        subscription_end: { type: string, format: date-time, nullable: true }
        cancel_at_period_end: { type: boolean }

    CheckoutRequest:
      type: object
      required: [plan, idempotency_key]
      properties:
        plan: { type: string, enum: [premium, extra] }
        idempotency_key: { type: string, format: uuid }

    CheckoutResponse:
      type: object
      required: [payment_id, url]
      properties:
        payment_id: { type: string, format: uuid }
        url: { type: string, format: uri, description: Checkout page to redirect the browser to }

    PaymentResult:
      type: object
      required: [payment_id, status, message]
      properties:
        payment_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, succeeded, failed] }
        message: { type: string }
        plan: { $ref: "#/components/schemas/PlanTier" }

    Payment:
      type: object
      required: [id, plan, amount_cents, currency, status, created_at]
      properties:
        id: { type: string, format: uuid }
        plan: { $ref: "#/components/schemas/PlanTier" }
        amount_cents: { type: integer }
        currency: { type: string, example: USD }
        status: { type: string, enum: [pending, succeeded, failed] }
        failure_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    RagQueryRequest:
      type: object
      required: [job_id, query]
      properties:
        job_id: { type: string, format: uuid }
        query: { type: string, example: "What do users complain about regarding pricing?" }

    RagQueryResponse:
      type: object
      required: [answer, citations]
      properties:
        answer: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Comment" }

paths:
  /health:
    get:
      summary: Health check endpoint for global gateway
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }

  /auth/signup:
    post:
      summary: Register a new user and organization
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, org_name, org_description]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 128 }
                org_name: { type: string, minLength: 1, maxLength: 50, description: "Trimmed; spaces only is rejected" }
                org_description: { type: string, minLength: 100, maxLength: 200 }
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: Invalid parameters
        "409":
          description: User already exists

  /auth/login:
    post:
      summary: Authenticate user and issue JWT
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, maxLength: 128 }
      responses:
        "200":
          description: >
            Password correct. 2FA off: AuthResponse with the access token.
            2FA on: TwoFactorChallenge (no access token), then call POST /auth/2fa/verify.
            Check the body: access_token or two_factor_required.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/AuthResponse" }
                  - { $ref: "#/components/schemas/TwoFactorChallenge" }
        "401":
          description: Invalid credentials (same answer for an unknown email and a wrong password)

  /auth/me:
    get:
      summary: Retrieve authenticated user profile
      operationId: getProfile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Profile retrieved successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Unauthorized

  /auth/42:
    get:
      summary: Start 42 OAuth login (redirects to 42's authorize page)
      operationId: fortyTwoLogin
      security: []
      responses:
        "302":
          description: Redirect to https://api.intra.42.fr/oauth/authorize

  /auth/42/callback:
    get:
      summary: 42 OAuth callback — redirects to the frontend with a token in the URL fragment
      operationId: fortyTwoCallback
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        "302":
          description: >
            Existing user: redirect to {FRONTEND_URL}/auth/42/done#token=<access_token>.
            Existing user with 2FA on: no access token; redirect to
            {FRONTEND_URL}/login/2fa#two_factor_token=<jwt valid 5 minutes>, then POST /auth/2fa/verify.
            First-time user: no account is created yet; redirect to
            {FRONTEND_URL}/auth/42/complete#signup_token=<jwt valid 10 minutes>.
        "401":
          description: 42 rejected the authorization code

  /auth/42/complete:
    post:
      summary: Finish a first-time 42 signup — creates the organization, user and Admin role
      operationId: fortyTwoCompleteSignup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signup_token, org_name, org_description, password]
              properties:
                signup_token: { type: string, description: "Short-lived JWT from the /auth/42/callback redirect" }
                org_name: { type: string, minLength: 1, maxLength: 50, description: "Trimmed; spaces only is rejected" }
                org_description: { type: string, minLength: 100, maxLength: 200 }
                password: { type: string, minLength: 8, maxLength: 128, description: "Lets a 42 user change their password or email later" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: Invalid parameters
        "409":
          description: User already exists
        "401":
          description: Invalid or expired signup token

  /auth/invite/accept:
    post:
      summary: Accept an organization invite — creates the invited user's account
      operationId: acceptInvite
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_token, password]
              properties:
                invite_token: { type: string, description: "JWT from the invite email link, valid 48 hours" }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "201":
          description: Account created with the role chosen by the inviting Admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: Invalid parameters, or the organization no longer exists
        "409":
          description: User already exists
        "401":
          description: Invalid or expired invite token
        "403":
          description: The organization reached its plan's member limit

  /auth/change-password:
    post:
      summary: Change the authenticated user's own password
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, maxLength: 128 }
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          description: Invalid parameters
        "401":
          description: Missing or invalid token, or wrong current password

  /auth/email:
    patch:
      summary: Change the authenticated user's own email (needs the current password)
      operationId: changeEmail
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email, password]
              properties:
                new_email: { type: string, format: email, maxLength: 254 }
                password: { type: string, maxLength: 128, description: "Current password" }
      responses:
        "200":
          description: Email changed
          content:
            application/json:
              schema:
                type: object
                required: [id, email]
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
        "400":
          description: Invalid parameters
        "409":
          description: Email already in use
        "401":
          description: Missing or invalid token, or wrong password

  /auth/forgot-password:
    post:
      summary: Send a password reset link by email
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "200":
          description: >
            Always the same answer, whether or not the email has an account
            (prevents account enumeration). If it does, an email is sent with a link to
            {FRONTEND_URL}/reset-password#reset_token=<jwt valid 15 minutes>.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          description: Invalid parameters

  /auth/reset-password:
    post:
      summary: Set a new password using the token from the reset email
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_token, new_password]
              properties:
                reset_token: { type: string, description: "JWT from the reset email link, valid 15 minutes" }
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          description: Invalid parameters
        "401":
          description: Invalid or expired reset token

  /auth/gdpr/export:
    post:
      summary: Export the authenticated user's personal data (GDPR right of access)
      operationId: exportMyData
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: >
            The caller's data as JSON. The password hash is never included.
            A receipt email is sent to the user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataExport" }
        "401":
          description: Unauthorized

  /auth/gdpr/delete:
    delete:
      summary: Delete the authenticated user's account (GDPR right to erasure)
      operationId: deleteMyAccount
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, maxLength: 128, description: "The caller's current password, asked again as confirmation" }
      responses:
        "204":
          description: >
            Account deleted. If the caller was the only member of their organization,
            the organization is deleted too. A receipt email is sent.
        "400":
          description: Invalid parameters, or the caller is the last Admin of an organization that still has other members
        "401":
          description: Missing or invalid token, or wrong password

  /auth/2fa/setup:
    post:
      summary: Start 2FA setup, returns a QR code (2FA stays off until /auth/2fa/enable)
      operationId: setupTwoFactor
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: >
            A new TOTP secret is saved for the user and 2FA is still off. Calling setup
            again before enable replaces the secret, so only the last QR code works.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorSetup" }
        "400":
          description: 2FA is already on ("Disable 2FA first")
        "401":
          description: Missing or invalid token
        "404":
          description: User not found

  /auth/2fa/enable:
    post:
      summary: Turn 2FA on with the first code from the authenticator app
      operationId: enableTwoFactor
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorCode" }
      responses:
        "200":
          description: 2FA is on. The next logins ask for a code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorState" }
        "400":
          description: code is not 6 digits, 2FA is already on, or setup was not called first
        "401":
          description: Missing or invalid token, or wrong code ("Invalid code")
        "404":
          description: User not found

  /auth/2fa/disable:
    post:
      summary: Turn 2FA off (needs a valid code) and delete the secret
      operationId: disableTwoFactor
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorCode" }
      responses:
        "200":
          description: 2FA is off and the secret is deleted. Turning it on again needs a new setup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorState" }
        "400":
          description: code is not 6 digits, or 2FA is already off
        "401":
          description: Missing or invalid token, or wrong code ("Invalid code")
        "404":
          description: User not found

  /auth/2fa/verify:
    post:
      summary: Second login step, swaps the two_factor_token and a code for the access token
      operationId: verifyTwoFactor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/TwoFactorCode" }
                - type: object
                  required: [two_factor_token]
                  properties:
                    two_factor_token: { type: string, description: From the /auth/login answer or the 42 callback redirect }
      responses:
        "200":
          description: Code correct, same body as a normal login
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: code is not 6 digits, or two_factor_token is missing or not a JWT
        "401":
          description: >
            "Invalid or expired 2fa token" (bad signature, older than 5 minutes, wrong purpose,
            or 2FA was turned off meanwhile), or "Invalid code". On a wrong code the same
            two_factor_token can be sent again until it expires.

  /orgs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Read the caller's organization
      operationId: getOrganization
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401":
          description: Unauthorized
        "404":
          description: Not the caller's organization, or it does not exist
    patch:
      summary: Update the organization's name and/or description (Admin only)
      operationId: updateOrganization
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 50, description: "Trimmed; spaces only is rejected" }
                description: { type: string, minLength: 100, maxLength: 200 }
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400":
          description: Invalid parameters
        "401":
          description: Unauthorized
        "403":
          description: Caller is not an Admin
        "404":
          description: Not the caller's organization
    delete:
      summary: Delete the organization and all of its user accounts (Admin only)
      operationId: deleteOrganization
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Organization and its users deleted
        "401":
          description: Unauthorized
        "403":
          description: Caller is not an Admin
        "404":
          description: Not the caller's organization

  /orgs/{id}/members:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List the members of the caller's organization
      operationId: listMembers
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "401":
          description: Unauthorized
        "404":
          description: Not the caller's organization
    post:
      summary: Invite a person by email (Admin only) — no account is created until they accept
      operationId: inviteMember
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: >
            Invite email sent, with a link to
            {FRONTEND_URL}/invite/accept#invite_token=<jwt valid 48 hours>.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          description: Invalid parameters, or a user with this email already exists
        "401":
          description: Unauthorized
        "403":
          description: Caller is not an Admin, or the organization reached its plan's member limit
        "404":
          description: Not the caller's organization

  /orgs/{id}/members/{userId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Change a member's role (Admin only)
      operationId: updateMemberRole
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: Role changed
          content:
            application/json:
              schema:
                type: object
                required: [id, role]
                properties:
                  id: { type: string, format: uuid }
                  role: { $ref: "#/components/schemas/Role" }
        "400":
          description: Invalid role, or this would leave the organization without an Admin
        "401":
          description: Unauthorized
        "403":
          description: Caller is not an Admin
        "404":
          description: Not the caller's organization, or the user is not a member of it
    delete:
      summary: Remove a member and delete their account (Admin only)
      operationId: removeMember
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Member removed
        "400":
          description: This would leave the organization without an Admin
        "401":
          description: Unauthorized
        "403":
          description: Caller is not an Admin
        "404":
          description: Not the caller's organization, or the user is not a member of it

  /orgs/{id}/api-key:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get the organization's API key metadata (Admin only)
      operationId: getApiKey
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The key's metadata, or null when the organization has no key
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key:
                    type: object
                    allOf: [{ $ref: "#/components/schemas/ApiKey" }]
                    nullable: true
        "401":
          description: Unauthorized
        "403":
          description: Caller is not an Admin
        "404":
          description: Not the caller's organization
    post:
      summary: Generate the organization's API key (Admin only) — the full key is returned once
      operationId: createApiKey
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 40, example: "Nightly export" }
      responses:
        "201":
          description: Key created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
        "400":
          description: Invalid label (not a string, or longer than 40 characters)
        "401":
          description: Unauthorized
        "403":
          description: Caller is not an Admin
        "404":
          description: Not the caller's organization
        "409":
          description: >
            A key already exists for this organization (revoke it first), or the
            caller already owns a key
    delete:
      summary: Revoke the organization's API key (Admin only) — the row is deleted
      operationId: revokeApiKey
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Key revoked; any request using it now gets 401 on the gateway
          content:
            application/json:
              schema:
                type: object
                required: [revoked, revoked_at]
                properties:
                  revoked: { type: boolean, example: true }
                  revoked_at: { type: string, format: date-time }
        "401":
          description: Unauthorized
        "403":
          description: Caller is not an Admin
        "404":
          description: Not the caller's organization, or the organization has no key

  /orgs/billing:
    get:
      summary: Current plan, subscription status, member count and plan limits of the caller's organization
      operationId: getBilling
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Billing details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Billing" }
        "401":
          description: Unauthorized

  /orgs/billing/checkout:
    post:
      summary: Start a payment for a paid plan (Admin only) and get the Stripe-mock checkout URL
      operationId: billingCheckout
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResponse" }
        "400":
          description: Invalid plan or idempotency key
        "401":
          description: Unauthorized
        "403":
          description: Caller is not an Admin
        "409":
          description: Idempotency key already used for another payment, or a subscription is already active

  /orgs/billing/verify/{paymentId}:
    parameters:
      - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Check a payment with Stripe-mock after the redirect; on success the subscription starts (30 days) (Admin only)
      operationId: billingVerify
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Payment status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResult" }
        "401":
          description: Unauthorized
        "403":
          description: Caller is not an Admin, or the bank data does not match the payment
        "404":
          description: Payment not found in the caller's organization

  /orgs/billing/simulate/{paymentId}:
    parameters:
      - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Mark a pending payment as succeeded or failed without a card (Admin only, NODE_ENV=development only)
      operationId: billingSimulate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [succeeded, failed] }
      responses:
        "201":
          description: Payment status; on succeeded the subscription starts (30 days)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResult" }
        "400":
          description: Invalid outcome
        "401":
          description: Unauthorized
        "403":
          description: Caller is not an Admin, or simulation is disabled (NODE_ENV is not development)
        "404":
          description: Payment not found in the caller's organization

  /orgs/billing/payments:
    get:
      summary: Last 50 payments of the caller's organization (Admin only)
      operationId: billingPayments
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Payments, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payment" }
        "401":
          description: Unauthorized
        "403":
          description: Caller is not an Admin

  /orgs/billing/cancel:
    post:
      summary: Cancel the active subscription at the end of the paid period (Admin only)
      operationId: billingCancel
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Subscription scheduled to end
          content:
            application/json:
              schema:
                type: object
                required: [message, ends_at]
                properties:
                  message: { type: string }
                  ends_at: { type: string, format: date-time }
        "401":
          description: Unauthorized
        "403":
          description: Caller is not an Admin
        "404":
          description: No active subscription

  /jobs:
    post:
      summary: Submit a new scrape and analysis job
      operationId: createJob
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, target]
              properties:
                mode: { $ref: "#/components/schemas/ScrapeMode" }
                target: { type: string }
                name:
                  type: string
                  description: Display name. Defaults to target when omitted.
                customer_persona: { $ref: "#/components/schemas/CustomerPersona" }
      responses:
        "201":
          description: Job created and queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400":
          description: Invalid job parameters
        "401":
          description: Unauthorized
        "403":
          description: Role does not allow job creation
        "503":
          description: Database or scrape queue unavailable

    get:
      summary: List all jobs for active tenant organization
      operationId: listJobs
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200":
          description: List of organization jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
        "401":
          description: Unauthorized

  /jobs/requeue:
    post:
      summary: Queue an existing job again
      operationId: requeueJob
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
      responses:
        "200":
          description: Job queued again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400":
          description: Invalid job id
        "401":
          description: Unauthorized
        "404":
          description: Job not found or belongs to another organization
        "409":
          description: Job is running or scraping
        "503":
          description: Scrape queue or database unavailable

  /jobs/{id}:
    get:
      summary: Get job status and details
      operationId: getJob
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Job found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404":
          description: Job not found or belongs to another organization

    put:
      summary: Update a job name
      operationId: updateJob
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
      responses:
        "200":
          description: Job name updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400":
          description: Invalid job name
        "401":
          description: Unauthorized
        "403":
          description: Role does not allow updates
        "404":
          description: Job not found or belongs to another organization

  /reports/{id}:
    get:
      summary: Retrieve the latest SWOT & Blue Ocean strategic report for a job
      operationId: getReport
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Report found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "404":
          description: Report not found

  /rag/query:
    post:
      summary: Execute semantic similarity query against job vector database
      operationId: queryRag
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RagQueryRequest" }
      responses:
        "200":
          description: Cited semantic response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagQueryResponse" }
        "401":
          description: Unauthorized
        "404":
          description: Target job vector data not found
