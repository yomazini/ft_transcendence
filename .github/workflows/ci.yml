# .github/workflows/ci.yml
# GitHub Actions CI Workflow for ft_transcendence
name: ci

on:
  pull_request:
    branches: [ main] #dev
  push:
    branches: [ main] #dev

jobs:
  gitleaks:
    name: Secret Leak Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, gateway-svc, auth-svc, scraper-svc, analysis-svc, reporting-svc, nginx]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} container
        run: docker build -t ft-${{ matrix.service }} ./${{ matrix.service }}
