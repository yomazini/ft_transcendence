[project]
name = "scraper-svc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "crono123456", email = "madanibk06@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bullmq>=3.2.3",
    "curl-cffi>=0.16.3",
    "fastapi>=0.162.0",
    "hvac>=2.4.0",
    "pgvector>=0.5.1",
    "pip>=26.2.2",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "redis>=7.4.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "types-hvac>=2.4.0.20260731",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
scraper-svc = "scraper_svc:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "sqlacodegen[pgvector]==4.0.4",
]

