
name: fake-bank

x-api-image: &api-image
  image: fake-bank-api:local
  build:
    context: ..
    dockerfile: docker/Dockerfile.api

services:
  postgres:
    image: postgres:17-alpine
    container_name: fake-bank-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fake_bank}
      POSTGRES_USER: ${POSTGRES_USER:-fake_bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fake_bank}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - default

  migrate:
    <<: *api-image
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fake_bank}:${POSTGRES_PASSWORD:-fake_bank}@postgres:5432/${POSTGRES_DB:-fake_bank}
    command:
      - pnpm
      - --filter
      - "@fake-bank/api"
      - db:migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - default

  api:
    <<: *api-image
    container_name: fake-bank-api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080

      # URL returned to the user's browser
      API_PUBLIC_BASE_URL: http://127.0.0.1:18080
      CHECKOUT_PUBLIC_BASE_URL: http://127.0.0.1:15173

      # Internal PostgreSQL connection
      DATABASE_URL: postgres://${POSTGRES_USER:-fake_bank}:${POSTGRES_PASSWORD:-fake_bank}@postgres:5432/${POSTGRES_DB:-fake_bank}

    ports:
      - "127.0.0.1:18080:8080"

    networks:
      default:
      ft_network:
        aliases:
          - fake-bank-api

    depends_on:
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  checkout-ui:
    image: fake-bank-checkout-ui:local
    container_name: fake-bank-checkout-ui
    build:
      context: ..
      dockerfile: docker/Dockerfile.checkout-ui

    ports:
      - "127.0.0.1:15173:5173"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:5173/health
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    restart: unless-stopped
    networks:
      - default

volumes:
  postgres-data:

networks:
  default:
    driver: bridge

  ft_network:
    external: true
    name: ft_network
